<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 2 Preference Capture</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 760px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 6px; }
    button { margin-top: 16px; padding: 10px 16px; }
    .error { color: #a40000; margin-top: 16px; }
    .result { margin-top: 16px; background: #f4f4f4; padding: 12px; border-radius: 6px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Restaurant Preference Input (Phase 2)</h1>
  <p>Enter preferences to build a standardized profile.</p>

  <form action="/submit" method="post">
    <label for="location">Location</label>
    <input id="location" name="location" required placeholder="Delhi" />

    <label for="budget">Budget (low / medium / high)</label>
    <input id="budget" name="budget" required placeholder="low" />

    <label for="cuisine">Cuisine</label>
    <input id="cuisine" name="cuisine" required placeholder="Italian" />

    <label for="minimum_rating">Minimum Rating (0-5)</label>
    <input id="minimum_rating" name="minimum_rating" type="number" min="0" max="5" step="0.1" value="0" />

    <label for="additional_preferences">Additional Preferences (comma-separated)</label>
    <input id="additional_preferences" name="additional_preferences" placeholder="family-friendly, quick service" />

    <button type="submit">Create Preference Profile</button>
  </form>

  {% if error %}
  <div class="error"><strong>Error:</strong> {{ error }}</div>
  {% endif %}

  {% if result %}
  <div class="result">
    <strong>Standardized Preference Profile:</strong>
    <pre>{{ result }}</pre>
  </div>
  {% endif %}
</body>
</html>
